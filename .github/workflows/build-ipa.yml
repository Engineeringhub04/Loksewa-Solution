name: Build iOS unsigned IPA (TrollStore)

on:
  # Manual builds ONLY (user request): trigger by hand from the Actions tab.
  # Produces an UNSIGNED .ipa for TrollStore (no Apple Developer account).
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned iOS app bundle
        # NOTE: `flutter build ipa --no-codesign` SKIPS the .ipa export in
        # current Flutter, so we build the .app and package Payload/*.ipa
        # manually — the standard TrollStore recipe.
        run: >
          flutter build ios --release --no-codesign
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Package unsigned IPA for TrollStore
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          mkdir -p ../ipa
          zip -qry ../ipa/Loksewa-Solution-unsigned.ipa Payload
          rm -rf Payload
          ls -la ../ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: loksewa-solution-unsigned-ipa
          path: build/ios/ipa/*.ipa
