plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Local Maven repo for project dependencies: holds artifacts that are
// neither in the Gradle cache nor downloadable through the egress proxy
// (TLS fail). Only added when the dir exists.
repositories {
    def localMaven = new File("/home/hatch/workspace/flutter-build/local-maven")
    if (localMaven.isDirectory()) {
        maven { url = localMaven.toURI() }
    }
}

android {
    namespace = "com.loksewasolutionnp.hub"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required by flutter_local_notifications (AAR metadata check).
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        // Same package as the Expo app — same Firebase project, no backend changes.
        applicationId = "com.loksewasolutionnp.hub"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 92
        versionName = "1.0.91"
    }

    signingConfigs {
        loksewa {
            storeFile = file("$rootDir/../../flutter-build/keystore/loksewa-debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // Persistent keystore under ~/workspace (survives VM replacements).
            // signingConfigs.debug auto-generates into /root/.android which is
            // ephemeral — when the VM was replaced the key changed silently and
            // Google Sign-In broke (Firebase SHA-1 mismatch). This key is the
            // same one v1.0.6+ shipped with, so updates install cleanly.
            // Passwords are the universal Android debug-keystore defaults.
            signingConfig = signingConfigs.loksewa
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by flutter_local_notifications (core library desugaring).
    // Artifact cached in flutter-build/local-maven (egress proxy TLS fail).
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
