name: loksewa_solution
description: Loksewa Solution — Flutter rewrite. Same Firebase backend as the Expo app (REST-based, no backend changes).
publish_to: 'none'
version: 1.0.90+91

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.1.0
  google_sign_in: ^7.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  crypto: ^3.0.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  app_links: ^7.2.1
  http_parser: ^4.0.2
  flutter_local_notifications: ^22.3.1
  curved_navigation_bar: ^1.0.6
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/ws-weeklytest.png
    - assets/images/ws-leaderboard_analytics.png
    - assets/images/ws-dailytest.png
    - assets/images/ws-discussion.png
    - assets/images/auth_himalayas_bg.png
    - assets/images/auth_illust_login.png
    - assets/images/auth_illust_signup.png
    - assets/images/auth_illust_reset.png
    - assets/icons/nav_home.json
    - assets/icons/nav_exam.json
    - assets/icons/nav_discussion.json
    - assets/icons/nav_profile.json
