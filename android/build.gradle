allprojects {
    repositories {
        // Local Maven repo FIRST: holds artifacts that are neither in the
        // Gradle cache nor downloadable through the egress proxy (TLS fail).
        // NOTE: user.home is /root for the Gradle daemon; HOME is /home/hatch.
        // Only added when the dir exists, so other machines are unaffected.
        def localMaven = new File("/home/hatch/workspace/flutter-build/local-maven")
        if (localMaven.isDirectory()) {
            maven { url = localMaven.toURI() }
        }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
