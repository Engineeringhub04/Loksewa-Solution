name: Build iOS unsigned IPA (TrollStore)

on:
  # Manual builds ONLY (user request): trigger by hand from the Actions tab.
  # Produces an UNSIGNED .ipa for TrollStore (no Apple Developer account).
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned iOS app bundle
        # NOTE: `flutter build ipa --no-codesign` SKIPS the .ipa export in
        # current Flutter, so we build the .app and package Payload/*.ipa
        # manually — the standard TrollStore recipe.
        #
        # SETUP (one time): repo Settings > Secrets and variables > Actions >
        # New repository secret: GOOGLE_SERVICES_JSON = whole google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is not set."
            echo "Add it at: repo Settings > Secrets and variables > Actions,"
            echo "pasting the WHOLE google-services.json content."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
          python3 - <<'PYEOF' > /tmp/firebase.env
          import json, plistlib, shlex
          gs = json.load(open('/tmp/google-services.json'))
          client = gs['client'][0]
          project_id = gs['project_info']['project_id']
          web_client_id = next(
              c['client_id'] for c in client['oauth_client'] if c['client_type'] == 3
          )
          with open('ios/Runner/GoogleService-Info.plist', 'rb') as f:
              app_id = plistlib.load(f)['GOOGLE_APP_ID']
          defs = {
              'FIREBASE_API_KEY': client['api_key'][0]['current_key'],
              'FIREBASE_PROJECT_ID': project_id,
              'FIREBASE_AUTH_DOMAIN': project_id + '.firebaseapp.com',
              'FIREBASE_STORAGE_BUCKET': gs['project_info']['storage_bucket'],
              'FIREBASE_MESSAGING_SENDER_ID': gs['project_info']['project_number'],
              'FIREBASE_APP_ID': app_id,
              'GOOGLE_WEB_CLIENT_ID': web_client_id,
          }
          for k, v in defs.items():
              print('%s=%s' % (k, shlex.quote(str(v))))
          PYEOF
          set -a
          . /tmp/firebase.env
          set +a
          rm -f /tmp/google-services.json /tmp/firebase.env
          flutter build ios --release --no-codesign \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Package unsigned IPA for TrollStore
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          mkdir -p ../ipa
          zip -qry ../ipa/Loksewa-Solution-unsigned.ipa Payload
          rm -rf Payload
          ls -la ../ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: loksewa-solution-unsigned-ipa
          path: build/ios/ipa/*.ipa
